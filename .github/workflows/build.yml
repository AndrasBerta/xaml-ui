name: Build and publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    env:
      # Continue the AppVeyor numbering (last published: 1.0.36)
      PACKAGE_VERSION_OFFSET: 36
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Compute package version
        shell: pwsh
        run: |
          $version = "1.0.$([int]$env:GITHUB_RUN_NUMBER + [int]$env:PACKAGE_VERSION_OFFSET)"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Package version: $version"

      - name: Build npm package
        shell: pwsh
        run: .\build_npm.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NpmPackages
          path: Output/*.tgz

      - name: Publish to npmjs.com
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: dist/xaml-ui
        run: npm publish
